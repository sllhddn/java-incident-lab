name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests (Testcontainers PostgreSQL)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke test against PostgreSQL
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 40); do curl -sf localhost:8080/actuator/health && break; sleep 3; done
          curl -sf localhost:8080/actuator/health
          curl -sf -X POST localhost:8080/api/orders -H 'Content-Type: application/json' \
            -d '{"customerId":4,"sku":"KB-001","quantity":1}'
          curl -sf localhost:8080/api/orders
      - name: Logs on failure
        if: failure()
        run: docker compose logs app
