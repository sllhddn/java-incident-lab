# Local stack: PostgreSQL + the app with a remote debugger port open.
# Attach IntelliJ/VS Code to localhost:5005 (see docs/DEBUGGING-PLAYBOOK.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentlab
      POSTGRES_USER: incidentlab
      POSTGRES_PASSWORD: incidentlab   # local demo only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentlab"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/incidentlab
      DB_USER: incidentlab
      DB_PASSWORD: incidentlab
      HIBERNATE_STATS: "true"
      JAVA_TOOL_OPTIONS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -XX:MaxRAMPercentage=75 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - dumps:/dumps

volumes:
  dumps:
